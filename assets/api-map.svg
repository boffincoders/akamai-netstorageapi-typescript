<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="476" viewBox="0 0 1000 476" role="img" aria-labelledby="t d">
<title id="t">ts-netstorageapi-akamai operations</title>
<desc id="d">Transfer: upload, uploadBuffer, download, downloadBuffer. Browse: dir, list, du, stat. Manage: mkdir, rmdir, rename, symlink, mtime, delete, quickDelete. Each has a callback form and a promise form ending in Async.</desc>
<style>

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cover, .motion { display: none; } }
</style>
<rect width="1000" height="476" rx="14" fill="#0d0d0d"/>
<rect x="0.5" y="0.5" width="999" height="475" rx="14" fill="none" stroke="#2a2a2a"/>
<text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">15 operations, each as a callback and a promise</text>
<g><image href="data:image/png;base64," x="954" y="23" width="26" height="26"/>
<text x="946" y="40.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a3a3a3">by Boffin Coders</text></g>
<text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a3a3a3">Every method has an Async twin, and every response has a TypeScript type.</text>
<rect x="16" y="84" width="312" height="272" rx="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="16" y="84" width="312" height="4" rx="2" fill="#d4a012"/>
<text x="32" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#d4a012">Transfer</text>
<text x="312" y="116" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#a3a3a3">name() · nameAsync()</text>
<text x="32" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#ffffff">upload</text>
<text x="312" y="150" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3a3a3">local file → NetStorage</text>
<text x="32" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#ffffff">uploadBuffer</text>
<text x="312" y="180" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3a3a3">Buffer → NetStorage</text>
<text x="32" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#ffffff">download</text>
<text x="312" y="210" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3a3a3">NetStorage → local file</text>
<text x="32" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#ffffff">downloadBuffer</text>
<text x="312" y="240" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3a3a3">NetStorage → memory</text>
<text x="32" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3a3a3">Buffers go straight to and from</text>
<text x="32" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3a3a3">memory, with no temporary files.</text>
