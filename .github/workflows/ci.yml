name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vitest 4 needs Node 20+. On Node 18 the same tests run on Vitest 3.
      - if: matrix.node == 18
        run: npm install --no-save vitest@3.2.7
      - run: npm test
      - name: Check package contents
        if: matrix.node == 22
        run: npm pack --dry-run
